name: Check URLs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lychee-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # --exclude-loopback ensures we don't check localhost URLs
          # --accept "200..=299,403" treats Cloudflare anti-bot blocks (403) as valid since the target page exists
          args: --exclude-loopback --accept "200..=299,403" './**/*.md' './**/*.rst'
